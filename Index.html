<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script defer src="./script.js"></script>
    <title>Calculator</title>
</head>
<body>

    <div class="wrapper">
        <div class="container">
            <input type="text" name="display" id="display">
            <div class="lite">
                <input type="button" value="C" class="lite" id="clear">
                <input type="button" value="." class="lite" id="num">
                <input type="button" value="%" class="lite" id="num">
                <input type="button" value="/" class="lite" id="num"> 
            </div>
            <div>
                <input type="button" value="7" id="num">
                <input type="button" value="8" id="num">
                <input type="button" value="9" id="num">
                <input type="button" value="*" class="lite" id="num">
            </div>
            <div>
                <input type="button" value="4" id="num">
                <input type="button" value="5" id="num">
                <input type="button" value="6" id="num">
                <input type="button" value="-" class="lite" id="num"> 
            </div>
            <div>
                <input type="button" value="1" id="num">
                <input type="button" value="2" id="num">
                <input type="button" value="3" id="num">
                <input type="button" value="+" class="lite" id="num">
            </div>
            <div>
                <input type="button" value="0" id="num">
                <input type="button" value="DEL" id="del">
                <input type="button" value="=" class="equal">
            </div>
    
        </div>
    </div>
    
</body>
</html>
